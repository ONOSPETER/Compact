# For a TEE host such as dstack / Phala Cloud. Put COMPACT_KEYS_B64 in the host's encrypted/sealed secrets.
services:
  compact-runner:
    build:
      context: ../..
      dockerfile: compact/deploy/Dockerfile
    ports:
      - "8787:8787"
    environment:
      COMPACT_KEYS_B64: ${COMPACT_KEYS_B64}
      COMPACT_ALLOWED_ORIGINS: ${COMPACT_ALLOWED_ORIGINS:-*}
    restart: unless-stopped
